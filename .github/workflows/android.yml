name: Android

# Every push to main builds a signed APK and publishes it as release build-<run_number>.
# The app's updater reads releases/latest and installs newer builds itself.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KS_PASS \
            --ks-key-alias dimplex --out "dimplex-heaters-${{ github.run_number }}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "dimplex-heaters-${{ github.run_number }}.apk" | head -2
          rm "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dimplex-heaters-apk
          path: android/dimplex-heaters-${{ github.run_number }}.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "dimplex-heaters-${{ github.run_number }}.apk" \
            -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Dimplex Heaters build ${{ github.run_number }}" \
            --notes "Download the APK on the phone and open it. Installed apps update themselves from here (Settings > Check for updates). Built from ${{ github.sha }}." \
            --latest
